name: Release

# Keep this filename: npm trusted publishing is bound to release.yml.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing vX.Y.Z tag to verify and publish with this workflow
        required: false
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    if: github.ref == 'refs/heads/main' && inputs.release_tag == ''
    runs-on: ubicloud-standard-2-ubuntu-2404
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Releases and tags use GITHUB_TOKEN on purpose: its events do not trigger
      # workflows, so the v* tag push cannot start a second publish below.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

      # Release PRs use a GitHub App token so they trigger CI like any other PR
      # and can satisfy the required `build` check on main.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

  verify-release:
    needs: release-please
    if: >-
      always() && !cancelled() &&
      (needs.release-please.outputs.release_created == 'true' ||
       (startsWith(github.ref, 'refs/tags/v') && needs.release-please.result == 'skipped') ||
       (github.event_name == 'workflow_dispatch' && startsWith(inputs.release_tag, 'v')))
    runs-on: ubicloud-standard-2-ubuntu-2404
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ inputs.release_tag || needs.release-please.outputs.tag_name || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Require checkout to match provenance source
        env:
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$WORKFLOW_SHA" || {
            echo "Release tag differs from the workflow source; use a reviewed release at this commit, never move an existing tag." >&2
            exit 1
          }
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm CLI >= 11.5.1; Node 22 ships npm 10.x.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package version
        run: node --input-type=module -e 'import fs from "node:fs"; const pkg = JSON.parse(fs.readFileSync("package.json")); if (process.env.RELEASE_TAG !== `v${pkg.version}`) throw new Error("Release tag does not match package version");'

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test:all

      - name: Build
        run: pnpm run build


  publish:
    needs: [release-please, verify-release]
    if: always() && !cancelled() && needs.verify-release.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write # required to create the GitHub Release below
      id-token: write # required for OIDC trusted publishing (+ provenance)
    env:
      RELEASE_TAG: ${{ inputs.release_tag || needs.release-please.outputs.tag_name || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Require checkout to match provenance source
        env:
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$WORKFLOW_SHA" || {
            echo "Release tag differs from the workflow source; use a reviewed release at this commit, never move an existing tag." >&2
            exit 1
          }
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm CLI >= 11.5.1; Node 22 ships npm 10.x.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package version
        run: node --input-type=module -e 'import fs from "node:fs"; const pkg = JSON.parse(fs.readFileSync("package.json")); if (process.env.RELEASE_TAG !== `v${pkg.version}`) throw new Error("Release tag does not match package version");'

      - name: Build
        run: pnpm run build

      # OIDC exchange happens automatically — no token. Provenance is attached.
      - name: Publish to npm (trusted publishing)
        run: npm publish --access public --provenance --ignore-scripts

      - name: Create GitHub Release for manual tags
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --generate-notes
          fi
