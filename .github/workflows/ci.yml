name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubicloud-standard-2-ubuntu-2404
    timeout-minutes: 20
    steps:
      - name: Runner identity
        run: echo "Runner $RUNNER_NAME ($RUNNER_OS/$RUNNER_ARCH)"
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test:all

      - name: Build
        run: pnpm run build
