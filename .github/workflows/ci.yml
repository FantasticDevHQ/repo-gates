name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubicloud-standard-2-ubuntu-2404
    timeout-minutes: 20
    steps:
      - name: Runner identity
        run: echo "Runner $RUNNER_NAME ($RUNNER_OS/$RUNNER_ARCH)"
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Validate actual PR metadata (read-only)
        run: node scripts/verify-pr-metadata.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Full repository checks
        run: pnpm run check:all

  repository-quality-gates:
    name: Repository quality gates
    needs: [build]
    if: ${{ always() }}
    runs-on: ubicloud-standard-2-ubuntu-2404
    timeout-minutes: 5
    steps:
      - name: Require all repository checks to succeed
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          echo "Runner $RUNNER_NAME ($RUNNER_OS/$RUNNER_ARCH)"
          echo "Repository build, typecheck, tests and metadata validation: $BUILD_RESULT"
          test "$BUILD_RESULT" = success
